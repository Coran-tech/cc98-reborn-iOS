name: iOS verification shell

on:
  workflow_dispatch:
    inputs:
      device_only:
        description: Build an unsigned device IPA without Simulator validation
        type: boolean
        required: false
        default: false
  # Bootstrap without modifying main. Only this dedicated branch can auto-run.
  push:
    branches: [codex/ios-verification-shell]
    paths:
      - .github/workflows/ios-shell.yml
      - ios/**
      - scripts/build-ios-shell.sh
      - scripts/package-ios-resources.cjs
      - tests/ios-*.test.cjs
      - manifest.json
      - src/**
      - popup/**
      - images/**
      - assets/**
      - experiments/question-mark/**
      - LICENSE

permissions:
  contents: read

jobs:
  unsigned-device-candidate:
    # Fixed stable image/toolchain with the Xcode 26.4+ simdiskimaged hang fix
    # (Apple issue 172343027). Full tests use iPhone 17 Pro / iOS 26.5.
    # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-Readme.md
    runs-on: macos-26-intel
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build selected unsigned iPhone candidate
        env:
          DEVICE_ONLY_REQUEST: ${{ github.event_name == 'workflow_dispatch' && inputs.device_only && 'true' || 'false' }}
        run: |
          if [[ "$DEVICE_ONLY_REQUEST" == "true" ]]; then
            bash scripts/build-ios-shell.sh --device-only
          else
            bash scripts/build-ios-shell.sh
          fi
      - name: Retain build evidence and successful candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-shell-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ios-shell/run.*/artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain lightweight install bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ios-shell/run.*/artifacts/*.ipa
            build/ios-shell/run.*/artifacts/build-status.txt
            build/ios-shell/run.*/artifacts/ipa-validation.json
            build/ios-shell/run.*/artifacts/README.txt
          if-no-files-found: error
          retention-days: 14
      - name: Retain lightweight visual diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ios-shell/run.*/artifacts/*.log
            build/ios-shell/run.*/artifacts/*.txt
            build/ios-shell/run.*/artifacts/*.json
            build/ios-shell/run.*/artifacts/screenshots/*.png
            build/ios-shell/run.*/artifacts/screenshots/*.json
            build/ios-shell/run.*/artifacts/screenshots/*.txt
          if-no-files-found: warn
          retention-days: 14
