<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reborn · 本地验证页</title>
<style>body{font:17px -apple-system,system-ui,sans-serif;line-height:1.55;margin:24px;color:#17332d;background:#f3f8f5}main{max-width:640px;margin:auto}h1{font-size:26px}label{display:block;margin-top:20px}input,textarea,button{box-sizing:border-box;font:inherit;max-width:100%}input,textarea{width:100%;padding:12px;border:1px solid #93aaa3;border-radius:8px;background:white}button{margin-top:16px;padding:12px 18px;border:0;border-radius:8px;color:white;background:#126b57}.note{color:#526b63}output{display:block;margin-top:16px}</style></head>
<body><main><h1>本地编辑探针</h1><p class="note">匿名测试资料，不连接论坛，也不模拟登录或 OpenID 绑定。</p>
<form id="probe-form"><label for="probe-title">标题（必填）</label><input id="probe-title" name="title" required autocomplete="off"><label for="probe-body">正文</label><textarea id="probe-body" name="body" rows="5" placeholder="测试中文输入、选区与粘贴"></textarea><label for="probe-file">附件选择</label><input id="probe-file" type="file" accept="image/*"><button type="submit">检查表单（不会发送）</button><output id="probe-result" aria-live="polite"></output></form>
<script>document.getElementById('probe-form').addEventListener('submit',function(event){event.preventDefault();document.getElementById('probe-result').textContent='本地校验通过；没有发送网络请求。';});</script></main></body></html>
