<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=393, initial-scale=1">
<title>响一下 · 界面预览</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC",
            "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  html, body { margin: 0; padding: 0; background: #05060b; }
  body {
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .screen {
    position: relative;
    width: 393px;
    height: 852px;
    overflow: hidden;
    background:
      radial-gradient(circle 330px at 4% 1%, rgba(124, 58, 237, .36), transparent 70%),
      radial-gradient(circle 340px at 103% 52%, rgba(14, 165, 233, .23), transparent 70%),
      radial-gradient(circle 300px at 22% 98%, rgba(236, 72, 153, .16), transparent 70%),
      linear-gradient(180deg, #080a12 0%, #0d1022 54%, #160a28 100%);
    color: #fff;
  }
  .status {
    height: 54px;
    padding: 16px 25px 0;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    font-size: 15px;
    font-weight: 650;
    letter-spacing: .1px;
  }
  .status-icons { display: flex; align-items: center; gap: 6px; padding-top: 2px; }
  .status-icons svg { display: block; }
  .content { padding: 14px 20px 0; }
  .app-header { display: flex; align-items: center; gap: 10px; }
  h1 {
    flex: 1;
    margin: 0;
    font-size: 38px;
    line-height: 1.08;
    font-weight: 850;
    letter-spacing: -1.2px;
  }
  .circle-btn {
    width: 48px;
    height: 48px;
    flex: none;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .12);
    background: rgba(255, 255, 255, .07);
    color: #fff;
  }
  .grid {
    margin-top: 22px;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }
  .card {
    position: relative;
    min-height: 118px;
    border-radius: 24px;
    padding: 15px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow:
      0 9px 12px rgba(0, 0, 0, .28),
      0 7px 10px rgba(0, 0, 0, .10);
    border: 1px solid rgba(255, 255, 255, .18);
    isolation: isolate;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -2;
    background: var(--bg);
  }
  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(circle 80px at 110% -10%, rgba(255, 255, 255, .24), transparent 70%),
      linear-gradient(180deg, transparent 35%, rgba(0, 0, 0, .24) 100%);
  }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .icon {
    width: 42px;
    height: 42px;
    border-radius: 13px;
    display: grid;
    place-items: center;
    background: rgba(255, 255, 255, .16);
    border: 1px solid rgba(255, 255, 255, .18);
  }
  .icon svg { width: 21px; height: 21px; display: block; }
  .more {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: rgba(0, 0, 0, .16);
    color: rgba(255, 255, 255, .9);
  }
  .more svg { width: 15px; height: 15px; display: block; }
  .card h2 {
    margin: auto 0 0;
    padding-top: 12px;
    font-size: 21px;
    line-height: 1.2;
    font-weight: 750;
    letter-spacing: -.2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .08);
  }
  .card.waveform { --bg: linear-gradient(135deg, #22d3ee, #2563eb); }
  .card.bell { --bg: linear-gradient(135deg, #fbbf24, #d97706); }
  .card.sparkles { --bg: linear-gradient(135deg, #c084fc, #7c3aed); }
  .card.bolt { --bg: linear-gradient(135deg, #fb7185, #be123c); }
  .card.music { --bg: linear-gradient(135deg, #86efac, #15803d); }
  .card.bubble { --bg: linear-gradient(135deg, #7dd3fc, #0369a1); }
  .card.camera { --bg: linear-gradient(135deg, #94a3b8, #334155); }
  .card.flame { --bg: linear-gradient(135deg, #fb923c, #b91c1c); }
  .card.leaf { --bg: linear-gradient(135deg, #5eead4, #0f766e); }
  .card.moon { --bg: linear-gradient(135deg, #f0abfc, #6d28d9); }
  .card.active {
    transform: scale(1.025);
    border-color: rgba(255, 255, 255, .8);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, .20),
      0 12px 30px rgba(94, 234, 212, .42),
      0 12px 24px rgba(0, 0, 0, .30);
  }
  .bottom-fade {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 130px;
    background: linear-gradient(180deg, transparent 0%, rgba(8, 8, 18, .50) 55%, rgba(8, 8, 18, .85) 100%);
    pointer-events: none;
  }
  .now-playing {
    position: absolute;
    left: 20px; right: 20px; bottom: 38px;
    height: 54px;
    border-radius: 22px;
    border: 1px solid rgba(255, 255, 255, .10);
    background: rgba(33, 33, 48, .58);
    backdrop-filter: blur(22px) saturate(150%);
    -webkit-backdrop-filter: blur(22px) saturate(150%);
    box-shadow: 0 10px 18px rgba(0, 0, 0, .30);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
  }
  .eq { display: flex; align-items: center; gap: 3px; height: 18px; width: 26px; }
  .eq i { display: block; width: 3px; border-radius: 999px; background: #5eead4; }
  .eq i:nth-child(1) { height: 8px; }
  .eq i:nth-child(2) { height: 15px; }
  .eq i:nth-child(3) { height: 6px; }
  .eq i:nth-child(4) { height: 12px; }
  .np-title { flex: 1; font-size: 14px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stop {
    width: 32px; height: 32px; flex: none;
    border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(255, 255, 255, .10);
    color: rgba(255, 255, 255, .85);
  }
  .stop svg { width: 12px; height: 12px; display: block; }
  .home-indicator {
    position: absolute;
    left: 50%; bottom: 9px;
    width: 134px; height: 5px;
    transform: translateX(-50%);
    border-radius: 999px;
    background: rgba(255, 255, 255, .8);
  }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
</style>
</head>
<body>
<svg class="sr-only" aria-hidden="true">
  <defs>
    <symbol id="i-waveform" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M4 9.5v5M8.7 5.8v12.4M13.4 8.3v7.4M18.1 4.5v15M22 10v4"/>
    </symbol>
    <symbol id="i-bell" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M18 8.4a6 6 0 0 0-12 0c0 6.6-2.7 6.6-2.7 8.6h17.4c0-2-2.7-2-2.7-8.6ZM9.6 20.4h4.8"/>
    </symbol>
    <symbol id="i-sparkles" viewBox="0 0 24 24">
      <path fill="currentColor" d="m12 2.5 1.8 4.9 4.9 1.8-4.9 1.8L12 15.9l-1.8-4.9-4.9-1.8 4.9-1.8L12 2.5Z"/>
      <path fill="currentColor" d="m19.1 14.5 1 2.7 2.7 1-2.7 1-1 2.7-1-2.7-2.7-1 2.7-1 1-2.7Z"/>
    </symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24">
      <path fill="currentColor" d="M13.4 1.8 4 13.3h6.5L9.6 22 20 10.3h-6.6l0-8.5Z"/>
    </symbol>
    <symbol id="i-music" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9.2 18V5.4l11-2.1v12.8"/>
      <circle cx="6.5" cy="18.2" r="2.7" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="17.5" cy="16.2" r="2.7" fill="none" stroke="currentColor" stroke-width="1.8"/>
    </symbol>
    <symbol id="i-bubble" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M21.2 11.5A8.5 8.5 0 0 1 12.7 20a8.9 8.9 0 0 1-3.5-.7L4.1 21l1.7-4.3a8.5 8.5 0 1 1 15.4-5.2Z"/>
      <circle cx="8.7" cy="11.5" r="1" fill="currentColor"/>
      <circle cx="12.2" cy="11.5" r="1" fill="currentColor"/>
      <circle cx="15.7" cy="11.5" r="1" fill="currentColor"/>
    </symbol>
    <symbol id="i-camera" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" d="M3.4 7.8h3.4L8.4 5.5h7.2l1.6 2.3h3.4a1.2 1.2 0 0 1 1.2 1.2v8.8a1.2 1.2 0 0 1-1.2 1.2H3.4a1.2 1.2 0 0 1-1.2-1.2V9a1.2 1.2 0 0 1 1.2-1.2Z"/>
      <circle cx="12" cy="13.4" r="3.7" fill="none" stroke="currentColor" stroke-width="1.7"/>
    </symbol>
    <symbol id="i-flame" viewBox="0 0 24 24">
      <path fill="currentColor" d="M13.2 2.2c.3 3.3-1.9 4.7-3.5 6.5-1.4 1.6-2.4 3.2-2.4 5.3a5.7 5.7 0 0 0 11.4 0c0-2.5-1.3-4.5-2.8-6.3-.8 1.2-1.8 1.8-2.7 2 .2-2.8-.5-5.4 0-7.5Z"/>
    </symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M20.5 3.5C11.8 3.4 4 7.4 4 14.1c0 3.1 2.4 5.4 5.4 5.4 6.4 0 10.5-7.2 11.1-16Z"/>
      <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M4.2 20.2c3-5 7.3-8.4 12.5-11.3"/>
    </symbol>
    <symbol id="i-moon" viewBox="0 0 24 24">
      <path fill="currentColor" d="M20.3 14.2A8.6 8.6 0 0 1 9.8 3.7 8.9 8.9 0 1 0 20.3 14.2Z"/>
      <path fill="currentColor" d="m18.4 2.5.7 1.9 1.9.7-1.9.7-.7 1.9-.7-1.9-1.9-.7 1.9-.7.7-1.9Z"/>
    </symbol>
    <symbol id="i-ellipsis" viewBox="0 0 24 24">
      <circle cx="5" cy="12" r="2" fill="currentColor"/>
      <circle cx="12" cy="12" r="2" fill="currentColor"/>
      <circle cx="19" cy="12" r="2" fill="currentColor"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M12 5v14M5 12h14"/>
    </symbol>
    <symbol id="i-speaker" viewBox="0 0 24 24">
      <path fill="currentColor" d="M3.5 9v6h4l5 4V5l-5 4h-4Z"/>
      <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M15.5 8.5a5 5 0 0 1 0 7M18.2 6a9 9 0 0 1 0 12"/>
    </symbol>
    <symbol id="i-stop" viewBox="0 0 24 24">
      <rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"/>
    </symbol>
  </defs>
</svg>

<main class="screen" aria-label="响一下 App 界面预览">
  <div class="status">
    <span>9:41</span>
    <span class="status-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff" aria-hidden="true">
        <rect x="0" y="8" width="3" height="4" rx="1"/>
        <rect x="5" y="6" width="3" height="6" rx="1"/>
        <rect x="10" y="3.5" width="3" height="8.5" rx="1"/>
        <rect x="15" y="1" width="3" height="11" rx="1"/>
      </svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
        <path d="M1.4 4.4a9.7 9.7 0 0 1 13.2 0M3.7 7a6.3 6.3 0 0 1 8.6 0M6.1 9.5a2.8 2.8 0 0 1 3.8 0"/>
        <circle cx="8" cy="11" r=".8" fill="#fff" stroke="none"/>
      </svg>
      <svg width="25" height="12" viewBox="0 0 25 12" aria-hidden="true">
        <rect x="0" y="0" width="21" height="12" rx="3.4" fill="none" stroke="rgba(255,255,255,.5)"/>
        <rect x="2" y="2" width="17" height="8" rx="1.8" fill="#fff"/>
        <path d="M22.4 4.1v3.8a2.5 2.5 0 0 0 0-3.8Z" fill="rgba(255,255,255,.55)"/>
      </svg>
    </span>
  </div>

  <div class="content">
    <header class="app-header">
      <h1>响一下</h1>
      <div class="circle-btn" aria-label="添加音效">
        <svg width="19" height="19" viewBox="0 0 24 24"><use href="#i-plus"/></svg>
      </div>
      <div class="circle-btn" aria-label="静音">
        <svg width="20" height="20" viewBox="0 0 24 24"><use href="#i-speaker"/></svg>
      </div>
    </header>

    <section class="grid" aria-label="音效">
      <article class="card waveform">
        <div class="card-top">
          <div class="icon"><svg viewBox="0 0 24 24"><use href="#i-waveform"/></svg></div>
          <div class="more"><svg viewBox="0 0 24 24"><use href="#i-ellipsis"/></svg></div>
        </div>
        <h2>声波</h2>
      </article>

      <article class="card bell">
        <div class="card-top">
          <div class="icon"><svg viewBox="0 0 24 24"><use href="#i-bell"/></svg></div>
          <div class="more"><svg viewBox="0 0 24 24"><use href="#i-ellipsis"/></svg></div>
        </div>
        <h2>叮咚</h2>
      </article>

      <article class="card sparkles">
        <div class="card-top">
          <div class="icon"><svg viewBox="0 0 24 24"><use href="#i-sparkles"/></svg></div>
          <div class="more"><svg viewBox="0 0 24 24"><use href="#i-ellipsis"/></svg></div>
        </div>
        <h2>魔法</h2>
      </article>

      <article class="card bolt">
        <div class="card-top">
          <div class="icon"><svg viewBox="0 0 24 24"><use href="#i-bolt"/></svg></div>
          <div class="more"><svg viewBox="0 0 24 24"><use href="#i-ellipsis"/></svg></div>
        </div>
        <h2>能量</h2>
      </article>

      <article class="card music">
        <div class="card-top">
          <div class="icon"><svg viewBox="0 0 24 24"><use href="#i-music"/></svg></div>
          <div class="more"><svg viewBox="0 0 24 24"><use href="#i-ellipsis"/></svg></div>
        </div>
        <h2>旋律</h2>
      </article>

      <article class="card bubble">
        <div class="card-top">
          <div class="icon"><svg viewBox="0 0 24 24"><use href="#i-bubble"/></svg></div>
          <div class="more"><svg viewBox="0 0 24 24"><use href="#i-ellipsis"/></svg></div>
        </div>
        <h2>泡泡</h2>
      </article>

      <article class="card camera">
        <div class="card-top">
          <div class="icon"><svg viewBox="0 0 24 24"><use href="#i-camera"/></svg></div>
          <div class="more"><svg viewBox="0 0 24 24"><use href="#i-ellipsis"/></svg></div>
        </div>
        <h2>快门</h2>
      </article>

      <article class="card leaf active">
        <div class="card-top">
          <div class="icon"><svg viewBox="0 0 24 24"><use href="#i-leaf"/></svg></div>
          <div class="more"><svg viewBox="0 0 24 24"><use href="#i-ellipsis"/></svg></div>
        </div>
        <h2>掌声</h2>
      </article>
    </section>
  </div>

  <div class="bottom-fade"></div>

  <div class="now-playing">
    <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="np-title">掌声</div>
    <div class="stop"><svg viewBox="0 0 24 24"><use href="#i-stop"/></svg></div>
  </div>

  <div class="home-indicator"></div>
</main>
</body>
</html>
